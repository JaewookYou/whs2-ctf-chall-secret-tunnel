version: "3"
services:
  extserver:
    restart: unless-stopped
    build: 
      context: .
      dockerfile: docker/extserver/Dockerfile
      args:
        FLAG_EXTSERVER: ${FLAG_EXTSERVER:-flag{set_FLAG_EXTSERVER_in_dotenv}}
    container_name: extserver
    volumes:
      # app.py 를 읽기 전용으로 마운트한다. 컨테이너 안에서는 변조가 불가능하고,
      # 호스트에서 고치면 재빌드 없이 재시작만으로 반영된다.
      - ./src/extserver/app.py:/home/appuser/app/app.py:ro
    environment:
      LC_ALL: C.UTF-8
    ports:
      - "8090:8090"
      - "2222:22"
    networks:
      - external_network
      
  intserver:
    restart: unless-stopped
    build: 
      context: .
      dockerfile: docker/intserver/Dockerfile
    container_name: intserver
    environment:
      LC_ALL: C.UTF-8
    networks:
      - external_network
      - internal_network

  flagserver:
    restart: unless-stopped
    build: 
      context: .
      dockerfile: docker/flagserver/Dockerfile
      args:
        FLAG_FLAGSERVER: ${FLAG_FLAGSERVER:-flag{set_FLAG_FLAGSERVER_in_dotenv}}
    container_name: flagserver
    environment:
      LC_ALL: C.UTF-8
    networks:
      - internal_network

networks:
  external_network:
    driver: bridge
  internal_network:
    driver: bridge
    internal: true